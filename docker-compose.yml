services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortsharvester_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./exports:/app/exports

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: shortsharvester_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
